name: Actualiser les données officielles
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        'src/**',
        'scripts/**',
        'tests/**',
        'package.json',
        'bun.lock',
        '.github/workflows/refresh-data.yml',
      ]
  pull_request:
permissions:
  contents: read
concurrency:
  group: official-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/data/requirements.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/data/requirements.txt
      - run: bun install --frozen-lockfile
      - run: npm run test:data && npm test && npm run lint
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: .cache/data
          key: official-sources-${{ github.run_id }}
          restore-keys: official-sources-
      - name: Acquérir, calibrer et valider le snapshot
        run: npm run data:sync && npm run data:validate
      - run: npm run build
      - name: Vérifier le site dans Chrome
        run: npm run test:browser
        env:
          CHROME_BIN: google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: site-et-snapshot-${{ github.run_id }}
          path: dist
          retention-days: 90
      - name: Résumé de validation
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open('public/data/manifest.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Snapshot {m['version']} — naissances jusqu’à {max(m['birthYears'])}, décès au {m['deathsThrough']}.\n\n")
              f.write(f"Modèle par prénom validé : {m['model']['validated']}.\n")
          PY
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-et-snapshot-${{ github.run_id }}
          path: dist
      - name: Publication atomique Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=prenom-esperance-de-vie --branch=main
